<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Library & Scanner</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card-manager-wrapper">
    <header>
      <h2>Card Database Search</h2>
      <p>Lookup card details, inventory value, and historical printings seamlessly.</p>
    </header>

    <!-- Real-Time Video Stream Scanner Interface -->
    <div class="scanner-action-panel">
      <button id="toggle-scanner-btn" class="btn-primary">Start Live Scanner</button>
      
      <div id="scanner-container" style="display: none; position: relative; margin-top: 15px;">
        <video id="live-card-stream" autoplay playsinline style="width: 100%; max-width: 500px; border-radius: 8px; border: 2px solid #333;"></video>
        <div class="scan-overlay-guide" style="position: absolute; top: 10%; left: 10%; right: 10%; height: 20%; border: 2px dashed #00ffcc; pointer-events: none;">
          <span style="color: #00ffcc; font-size: 12px; background: rgba(0,0,0,0.7); padding: 2px 6px;">Align Card Title Here</span>
        </div>
      </div>
    </div>

    <!-- Dynamic Set Selector (Populated with ALL valid printings, fixing single-set filtering bugs) -->
    <div class="form-group" style="margin-top: 20px;">
      <label for="card-set-selector">Select Card Edition / Printing Set:</label>
      <select id="card-set-selector" class="form-control">
        <option value="">Scan or search a card to view valid sets...</option>
      </select>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
